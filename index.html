<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart问答指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
/* 强制全局纯白背景，清除渐变 */
html,body,#app{
  background: #ffffff !important;
}
/* 顶部Banner图片区 */
.banner-box{width:100%;height:220px;border-radius:12px;overflow:hidden;margin-bottom:20px}
.banner-box img{width:100%;height:100%;object-fit:cover}
/* 搜索框样式 */
.search-custom{width:100%;padding:12px 16px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none;margin-bottom:24px}
.search-custom:focus{border-color:#42b983}
/* 横向标签栏 */
.tab-wrap{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab-item{padding:10px 18px;border:1px solid #42b983;border-radius:6px;background:#fff;color:#42b983;cursor:pointer}
.tab-item.active{background:#42b983;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
window.$docsify = {
  name: 'Lovart问答指南',
  loadSidebar: true,
  loadNavbar: true,
  subMaxLevel: 3, // 左侧目录自动抓取h1~h3标题，点击直达
  search: {
    placeholder: '🔍 搜索问题、关键词',
    noData: '没有匹配到相关问答',
    depth: 3
  },
  tabs: {persist:true}
}
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
</body>
</html>
