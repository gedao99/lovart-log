<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart 防自动化封控指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
/* 极简白底与高级字体 */
html, body, #app { background: #ffffff !important; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; }

/* 顶部的高亮框（放在首页） */
.hero-box {
  background-color: #f4f7f9; 
  border-left: 5px solid #64748b; 
  border-radius: 8px;
  padding: 24px 30px;
  margin-bottom: 30px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}
.hero-box p { margin: 0 0 16px 0; color: #475569; line-height: 1.8; font-size: 15px; }
.hero-box p:last-child { margin-bottom: 0; }
.hero-box b { color: #0f172a; font-weight: 600; }

/* 独立页面里的卡片和视频 */
.content-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; }
.video-container { max-width: 100%; margin: 20px 0; }
.video-container iframe, .video-container video { width: 100%; height: 500px; border: none; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

/* 侧边栏稍微加宽，方便看长标题 */
.sidebar { width: 280px; }
.content { left: 300px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
window.$docsify = {
  name: 'Lovart 防封控指南',
  loadSidebar: true,      // 开启左侧目录
  loadNavbar: false,
  subMaxLevel: 2,         // 自动展开左侧子目录
  auto2top: true,         // 切换页面时自动回到顶部
  search: {
    placeholder: '🔍 搜索问题、关键词...',
    noData: '没有找到相关解答',
    depth: 3              // 搜索深度
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<!-- 必须加载搜索插件 -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
