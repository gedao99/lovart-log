<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart防封控指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.12.2/lib/themes/vue.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .hero-box {
    background-color: #f4f7f9; border-left: 5px solid #64748b; border-radius: 8px;
    padding: 24px 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .hero-box h2 { margin-top: 0; color: #1e293b; font-size: 22px; margin-bottom: 20px; }
  .hero-box p { margin: 0 0 16px 0; color: #475569; line-height: 1.8; font-size: 15px; }
  .hero-box b { color: #0f172a; font-weight: 600; }
  .video-container { max-width: 100%; margin: 20px 0; }
  .video-container iframe { width: 100%; height: 500px; border: none; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  /* 修复搜索框占位文字样式，让提示文字正常显示 */
  .search-input::placeholder {
    color: #999 !important;
  }
  .search-input {
    border-radius: 6px !important;
    padding: 4px 8px;
  }
</style>
</head>
<body>
<div id="app">正在加载，请稍候...</div>

<script>
window.$docsify = {
  name: 'Lovart防封控指南',
  loadSidebar: true,
  loadNavbar: true,
  subMaxLevel: 2,
  auto2top: true,
  // 兜底：强制侧边栏默认打开
  sidebarDisplayLevel: 1,
  search: {
    paths: 'auto',
    placeholder: {
      '/': '🔍 输入关键词搜索问题...'
    },
    noData: '😔 没有找到匹配内容',
    depth: 3
  }
}
</script>

<!-- 锁定稳定版本，避免CDN自动更新导致异常 -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4.12.2"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.12.2/lib/plugins/search.min.js"></script>
</body>
</html>
