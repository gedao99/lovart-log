<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart 防封控指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
html, body, #app { background: #ffffff !important; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; }

/* 首页高亮框 */
.hero-box {
  background-color: #f4f7f9; 
  border-left: 5px solid #64748b; 
  border-radius: 8px;
  padding: 24px 30px;
  margin-bottom: 30px;
}
.hero-box h2 { margin-top: 0; color: #1e293b; font-size: 22px; margin-bottom: 20px; }
.hero-box p { margin: 0 0 16px 0; color: #475569; line-height: 1.8; font-size: 15px; }
.hero-box b { color: #0f172a; font-weight: 600; }

/* 详情页卡片和视频 */
.content-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; }
.content-card li { color: #475569; line-height: 1.8; font-size: 15px; margin-bottom: 8px;}
.video-container { max-width: 100%; margin: 20px 0; }
.video-container iframe { width: 100%; height: 500px; border: none; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

/* 侧边栏宽度 */
.sidebar { width: 280px; }
.content { left: 300px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
window.$docsify = {
  name: 'Lovart 防封控指南',
  loadSidebar: true,      // 开启左侧目录
  loadNavbar: false,
  subMaxLevel: 2,
  auto2top: true,         
  search: {
    placeholder: '🔍 搜索问题...',
    noData: '没有找到',
    depth: 3              
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<!-- 加载搜索插件，让顶部搜索生效 -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
