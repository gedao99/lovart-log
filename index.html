<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart 防自动化封控指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
/* 极简：强制全局纯白背景 */
html, body, #app { background: #ffffff !important; }
/* 视频容器居中 */
.video-container { max-width: 900px; margin: 20px auto; text-align: center; }
/* 调整 Docsify 的默认侧边栏宽度，稍微收窄一点显得更精致 */
.sidebar { width: 250px; }
.content { left: 270px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
window.$docsify = {
  name: 'Lovart 防自动化封控指南',
  loadSidebar: true,
  loadNavbar: false, // 不需要顶部导航了，直接关掉
  subMaxLevel: 1,    // 侧边栏只抓取一级标题
  search: {
    placeholder: '🔍 搜索关键词...',
    noData: '没有找到相关内容'
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
