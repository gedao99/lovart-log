<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovart 防自动化封控指南</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
<style>
/* 极简白底 */
html, body, #app { background: #ffffff !important; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; }

/* 顶部的大方框（高级低饱和莫兰迪蓝） */
.hero-box {
  background-color: #f4f7f9; 
  border-left: 5px solid #64748b; /* 高级灰蓝边框 */
  border-radius: 8px;
  padding: 24px 30px;
  margin-bottom: 30px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}
.hero-box p { 
  margin: 0 0 16px 0; 
  color: #475569; 
  line-height: 1.8; 
  font-size: 15px; 
}
.hero-box p:last-child { margin-bottom: 0; }
.hero-box b { color: #0f172a; font-weight: 600; }

/* 下方的卡片 */
.content-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 24px;
}

/* 视频容器 */
.video-container { max-width: 900px; margin: 20px auto; text-align: center; }
.video-container iframe, .video-container video {
  width: 100%;
  height: 520px;
  border: none;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.sidebar { width: 260px; }
.content { left: 280px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
window.$docsify = {
  name: 'Lovart 防自动化封控指南',
  loadSidebar: true,
  loadNavbar: false,
  subMaxLevel: 1,
  search: { placeholder: '🔍 搜索...', noData: '没有找到' }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
